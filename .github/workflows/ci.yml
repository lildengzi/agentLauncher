name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  RUST_VERSION: "stable"
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  lint-and-test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Vue/TS)
        run: pnpm run build

      - name: Lint (if configured)
        run: |
          if [ -f .eslintrc* ] || [ -f eslint.config.* ]; then
            pnpm exec eslint . --ext .ts,.vue
          else
            echo "No ESLint config found, skipping"
          fi

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  tauri-build-matrix:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [lint-and-test, rust-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-x86_64
            asset_pattern: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/dsh-launcher
          # Linux aarch64 (ARM64) — native arm64 runner (free for public repos)
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-aarch64
            asset_pattern: |
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/dsh-launcher
          # macOS x86_64 (Intel)
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: dsh-launcher-macos-x86_64
            asset_pattern: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
              target/release/dsh-launcher
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact_name: dsh-launcher-macos-aarch64
            asset_pattern: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app
              target/aarch64-apple-darwin/release/dsh-launcher
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: dsh-launcher-windows-x86_64
            asset_pattern: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/dsh-launcher.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux deps (x86_64)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev

      - name: Install Linux deps (aarch64)
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            xdg-utils

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential libarchive-tools zstd zip
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }} -- --locked

      - name: Create release packages (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist

          # Native installers built by Tauri: .deb, .rpm, .AppImage
          cp "${RELEASE_DIR}/bundle/deb/"*.deb           dist/ 2>/dev/null || true
          cp "${RELEASE_DIR}/bundle/rpm/"*.rpm           dist/ 2>/dev/null || true
          cp "${RELEASE_DIR}/bundle/appimage/"*.AppImage dist/ 2>/dev/null || true

          # Arch Linux package: convert Tauri's .deb into a real pacman .pkg.tar.zst.
          DEB=$(ls "${RELEASE_DIR}/bundle/deb/"*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            fpm -s deb -t pacman \
              --no-auto-depends \
              --depends webkit2gtk-4.1 \
              --depends gtk3 \
              --depends libayatana-appindicator \
              --pacman-compression zstd \
              -p dist/ "$DEB"
          fi

          # Raw binary (zipped)
          zip -j "dist/dsh-launcher-${ARCH}-linux.zip" "${RELEASE_DIR}/dsh-launcher"

          echo "== dist contents =="
          ls -lh dist/

      - name: Create release packages (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          PKG_NAME="dsh-launcher-${{ matrix.arch }}-macos"
          mkdir -p "dist/${PKG_NAME}"

          # Copy .app bundle
          cp -r "${RELEASE_DIR}/bundle/macos/"*.app "dist/${PKG_NAME}/" 2>/dev/null || true

          # Copy binary
          cp "${RELEASE_DIR}/dsh-launcher" "dist/${PKG_NAME}/" 2>/dev/null || true

          # Create .zip package
          (cd dist && zip -r "${PKG_NAME}.zip" "${PKG_NAME}")
          echo "Created dist/${PKG_NAME}.zip"

      - name: Create release packages (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $pkgName = "dsh-launcher-${{ matrix.arch }}-windows"
          New-Item -ItemType Directory -Force -Path "dist/$pkgName" | Out-Null

          # Copy binary
          Copy-Item "${releaseDir}/dsh-launcher.exe" "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Copy NSIS installer
          Copy-Item "${releaseDir}/bundle/nsis/*.exe" "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Copy MSI
          Copy-Item "${releaseDir}/bundle/msi/*.msi" "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Create .zip
          Compress-Archive -Path "dist/$pkgName/*" -DestinationPath "dist/${pkgName}.zip" -Force
          echo "Created dist/${pkgName}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/dist/*
          retention-days: 7