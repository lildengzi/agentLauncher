name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-x86_64
            asset_pattern: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/dsh-launcher
          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-aarch64
            asset_pattern: |
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/dsh-launcher
          # macOS x86_64 (Intel)
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: dsh-launcher-macos-x86_64
            asset_pattern: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
              target/release/dsh-launcher
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact_name: dsh-launcher-macos-aarch64
            asset_pattern: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app
              target/aarch64-apple-darwin/release/dsh-launcher
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: dsh-launcher-windows-x86_64
            asset_pattern: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/dsh-launcher.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux deps (x86_64)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            zstd

      - name: Install Linux deps (aarch64)
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            zstd \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build --locked --target ${{ matrix.target }}

      - name: Create release packages (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          PKG_NAME="dsh-launcher-${{ matrix.arch }}-linux"
          mkdir -p "dist/${PKG_NAME}"

          # Copy binary
          cp "${RELEASE_DIR}/dsh-launcher" "dist/${PKG_NAME}/"

          # Copy bundles
          cp -r "${RELEASE_DIR}/bundle/deb/"* "dist/${PKG_NAME}/" 2>/dev/null || true
          cp -r "${RELEASE_DIR}/bundle/appimage/"* "dist/${PKG_NAME}/" 2>/dev/null || true

          # Create .tar.zst package (Arch Linux style)
          tar --zstd -cf "dist/${PKG_NAME}.tar.zst" -C "dist" "${PKG_NAME}"
          echo "Created dist/${PKG_NAME}.tar.zst"

          # Create .zip package
          (cd dist && zip -r "${PKG_NAME}.zip" "${PKG_NAME}")
          echo "Created dist/${PKG_NAME}.zip"

      - name: Create release packages (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          PKG_NAME="dsh-launcher-${{ matrix.arch }}-macos"
          mkdir -p "dist/${PKG_NAME}"

          # Copy .app bundle
          cp -r "${RELEASE_DIR}/bundle/macos/"*.app "dist/${PKG_NAME}/" 2>/dev/null || true

          # Copy binary
          cp "${RELEASE_DIR}/dsh-launcher" "dist/${PKG_NAME}/" 2>/dev/null || true

          # Copy DMG
          cp -r "${RELEASE_DIR}/bundle/dmg/"* "dist/${PKG_NAME}/" 2>/dev/null || true

          # Create .zip package
          (cd dist && zip -r "${PKG_NAME}.zip" "${PKG_NAME}")
          echo "Created dist/${PKG_NAME}.zip"

      - name: Create release packages (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $pkgName = "dsh-launcher-${{ matrix.arch }}-windows"
          New-Item -ItemType Directory -Force -Path "dist/$pkgName" | Out-Null

          # Copy binary
          Copy-Item "${releaseDir}/dsh-launcher.exe" "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Copy NSIS installer
          Copy-Item "${releaseDir}/bundle/nsis/"*.exe "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Copy MSI
          Copy-Item "${releaseDir}/bundle/msi/"*.msi "dist/$pkgName/" -ErrorAction SilentlyContinue

          # Create .zip
          Compress-Archive -Path "dist/$pkgName/*" -DestinationPath "dist/${pkgName}.zip" -Force
          echo "Created dist/${pkgName}.zip"

      - name: Collect release assets
        id: assets
        run: |
          echo "assets<<EOF" >> $GITHUB_OUTPUT
          ls -1 src-tauri/dist/*.zip src-tauri/dist/*.tar.zst 2>/dev/null || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/dist/*.zip
            src-tauri/dist/*.tar.zst

      - name: Upload artifacts for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/dist/*.zip
            src-tauri/dist/*.tar.zst
          retention-days: 30