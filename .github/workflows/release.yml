name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-x86_64
            asset_pattern: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/dsh-launcher
          # Linux aarch64 (ARM64) — native arm64 runner (free for public repos)
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: dsh-launcher-linux-aarch64
            asset_pattern: |
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/dsh-launcher
          # macOS x86_64 (Intel)
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: dsh-launcher-macos-x86_64
            asset_pattern: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
              target/release/dsh-launcher
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact_name: dsh-launcher-macos-aarch64
            asset_pattern: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app
              target/aarch64-apple-darwin/release/dsh-launcher
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: dsh-launcher-windows-x86_64
            asset_pattern: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/dsh-launcher.exe
          # Windows aarch64 (ARM64) — native windows-11-arm runner (free for public repos)
          - os: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
            artifact_name: dsh-launcher-windows-aarch64
            asset_pattern: |
              target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
              target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/aarch64-pc-windows-msvc/release/dsh-launcher.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux deps (x86_64)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            zstd

      - name: Install Linux deps (aarch64)
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            zstd \
            xdg-utils

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential libarchive-tools zip
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }} -- --locked

      - name: Create release packages (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist

          # Native installers built by Tauri: .deb, .rpm, .AppImage
          cp "${RELEASE_DIR}/bundle/deb/"*.deb           dist/ 2>/dev/null || true
          cp "${RELEASE_DIR}/bundle/rpm/"*.rpm           dist/ 2>/dev/null || true
          cp "${RELEASE_DIR}/bundle/appimage/"*.AppImage dist/ 2>/dev/null || true

          # Arch Linux package: convert Tauri's .deb into a real pacman .pkg.tar.zst.
          # Drop the deb-derived depends and declare the correct Arch package names.
          DEB=$(ls "${RELEASE_DIR}/bundle/deb/"*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            fpm -s deb -t pacman \
              --no-auto-depends \
              --depends webkit2gtk-4.1 \
              --depends gtk3 \
              --depends libayatana-appindicator \
              --pacman-compression zstd \
              -p dist/ "$DEB"
          fi

          # Raw binary (zipped) for people who just want the executable.
          zip -j "dist/dsh-launcher-${ARCH}-linux.zip" "${RELEASE_DIR}/dsh-launcher"

          echo "== dist contents =="
          ls -lh dist/

      - name: Create release packages (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          set -e
          RELEASE_DIR="target/${{ matrix.target }}/release"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist

          # Native installer: .dmg (renamed per-arch so x86_64 and aarch64 don't collide)
          for dmg in "${RELEASE_DIR}/bundle/dmg/"*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "dist/dsh-launcher-${ARCH}-macos.dmg"
          done

          # .app bundle (zipped, since .app is a directory)
          APP=$(ls -d "${RELEASE_DIR}/bundle/macos/"*.app 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            (cd "$(dirname "$APP")" && zip -qr - "$(basename "$APP")") > "dist/dsh-launcher-${ARCH}-macos.zip"
          fi

          echo "== dist contents =="
          ls -lh dist/

      - name: Create release packages (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # Native installers: MSI + NSIS setup .exe (uploaded directly)
          Copy-Item "${releaseDir}/bundle/msi/*.msi"  "dist/" -ErrorAction SilentlyContinue
          Copy-Item "${releaseDir}/bundle/nsis/*.exe" "dist/" -ErrorAction SilentlyContinue

          # Portable: zip of the raw executable
          Compress-Archive -Path "${releaseDir}/dsh-launcher.exe" -DestinationPath "dist/dsh-launcher-${arch}-windows.zip" -Force

          Write-Host "== dist contents =="
          Get-ChildItem dist | Format-Table Name,Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/dist/*.deb
            src-tauri/dist/*.rpm
            src-tauri/dist/*.AppImage
            src-tauri/dist/*.pkg.tar.zst
            src-tauri/dist/*.dmg
            src-tauri/dist/*.msi
            src-tauri/dist/*.exe
            src-tauri/dist/*.zip

      - name: Upload artifacts for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/dist/*.deb
            src-tauri/dist/*.rpm
            src-tauri/dist/*.AppImage
            src-tauri/dist/*.pkg.tar.zst
            src-tauri/dist/*.dmg
            src-tauri/dist/*.msi
            src-tauri/dist/*.exe
            src-tauri/dist/*.zip
          retention-days: 30