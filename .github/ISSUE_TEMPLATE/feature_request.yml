name: Feature Request
description: 提议一个新功能或改进 / Suggest a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！请先搜索已有 Issue / Roadmap，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？ / Problem to solve
      description: 这个功能要解决什么痛点？没有它会怎样？
      placeholder: 希望能一键导入/导出实例，方便在多台机器间同步...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案 / Proposal
      description: 你期望的交互/行为是怎样的？
      placeholder: 在实例卡片菜单增加 Export/Import，导出为 zip...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 是否考虑过其他实现方式？
      placeholder: 手动复制 ~/.agentlauncher/instances 目录...

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块 / Scope
      multiple: true
      options:
        - Instance / 沙箱
        - Plugin Hub
        - Executor / dsh
        - UI / UX
        - Docs
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 已搜索现有 Issue / Roadmap，确认未重复
          required: true
        - label: 愿意协助实现或测试
          required: false
