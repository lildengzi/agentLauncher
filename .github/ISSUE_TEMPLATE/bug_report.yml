name: Bug Report
description: 报告一个可复现的缺陷 / Report a reproducible bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue，避免重复。
        Thanks for reporting! Please search existing issues first.

  - type: textarea
    id: describe
    attributes:
      label: 问题描述 / Describe the bug
      description: 清晰简洁地描述问题是什么
      placeholder: 启动实例后点击 Launch 无反应，日志显示...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 创建实例 ...
        2. 点击 ...
        3. 看到错误 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      placeholder: 应该打开浏览器并跳转到 dsh web 页面
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 粘贴相关日志或截图（注意脱敏 API Key）
      render: shell

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: app 版本 / dsh 版本 / OS
      placeholder: "agentLauncher v0.1.0 / dsh v0.x / Windows 11 / macOS 15"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 已搜索现有 Issue，确认未重复
          required: true
        - label: 可稳定复现 / 可提供最小复现实例
          required: false
