[package]
name = "agentlauncher"
version = "0.1.0"
description = "AI Agent GUI launcher built on dsh"
edition = "2021"
license = "MIT"
repository = "https://github.com/lildengzi/agentLauncher"
authors = ["lildengzi"]

[lib]
name = "agentlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
# Market feeds are fetched here rather than in the webview: a URL the *user* typed
# owes us no CORS header. rustls only — an OpenSSL/native-tls build would tie the
# release to whatever libssl each distro ships. `gzip` is not cosmetic: the one feed
# we ship is 11.6 MB of JSON served with `Vary: Accept-Encoding`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
