[package]
name = "agentlauncher"
version = "0.1.0"
description = "AI Agent GUI launcher built on dsh"
edition = "2021"
license = "MIT"
repository = "https://github.com/lildengzi/agentLauncher"
authors = ["lildengzi"]

[lib]
name = "agentlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
